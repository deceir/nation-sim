services:
  db:
    image: mysql:8.4
    environment: {MYSQL_USER: diplomatia, MYSQL_PASSWORD: diplomatia, MYSQL_DATABASE: diplomatia, MYSQL_ROOT_PASSWORD: local-root-only}
    volumes: [diplomatia-db:/var/lib/mysql]
    healthcheck: {test: [CMD, mysqladmin, ping, -h, localhost, -u, root, -plocal-root-only], interval: 5s, timeout: 3s, retries: 20}
  migrate:
    build: {context: ., dockerfile: Dockerfile.api}
    command: [./migrate]
    environment: {DATABASE_URL: "diplomatia:diplomatia@tcp(db:3306)/diplomatia?parseTime=true&multiStatements=true"}
    depends_on: {db: {condition: service_healthy}}
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    environment: {DATABASE_URL: "diplomatia:diplomatia@tcp(db:3306)/diplomatia?parseTime=true&multiStatements=true", COOKIE_SECURE: "false"}
    depends_on: {feeder: {condition: service_completed_successfully}}
  feeder:
    build: {context: ., dockerfile: Dockerfile.api}
    command: [./feed]
    environment: {DATABASE_URL: "diplomatia:diplomatia@tcp(db:3306)/diplomatia?parseTime=true"}
    depends_on: {migrate: {condition: service_completed_successfully}}
  web:
    build: {context: ., dockerfile: Dockerfile.web}
    ports: ["3000:80"]
    depends_on: [api]
volumes: {diplomatia-db: {}}
